<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#242120"/>
  <meta name="color-scheme" content="only light"/>
  <link rel="icon" type="image/png" href="./logo-furgon.png"/>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
  <title>Territorios</title>
  <meta name="description" content="Mapa y programa de salidas · Congregación Este, San Francisco."/>
  <meta property="og:type" content="website"/>
  <meta property="og:title" content="Territorios"/>
  <meta property="og:description" content="Mapa y programa de salidas · Congregación Este, San Francisco."/>
  <meta property="og:image" content="https://territorios-este-sf.web.app/compartir-territorios-este-v3.jpg"/>
  <meta property="og:image:type" content="image/jpeg"/>
  <meta property="og:image:width" content="1254"/>
  <meta property="og:image:height" content="1254"/>
  <meta property="og:image:alt" content="Territorios Este, San Francisco"/>
  <meta name="twitter:card" content="summary_large_image"/>
  <meta name="twitter:title" content="Territorios"/>
  <meta name="twitter:image" content="https://territorios-este-sf.web.app/compartir-territorios-este-v3.jpg"/>
  <script>
    try {
      document.documentElement.dataset.appTheme = localStorage.getItem('app-v2-theme') === 'dark' ? 'dark' : 'light'
    } catch (_) {
      document.documentElement.dataset.appTheme = 'light'
    }
    const bootDark = document.documentElement.dataset.appTheme === 'dark'
    // Samsung needs both supported themes declared; Chrome retains its auto-dark opt-out.
    const nativeSamsungTheme = /SamsungBrowser\//i.test(navigator.userAgent)
    document.querySelector('meta[name="color-scheme"]').content = nativeSamsungTheme ? 'light dark' : bootDark ? 'dark' : 'only light'
    document.querySelector('meta[name="theme-color"]').content = bootDark ? '#1c1b19' : '#f5f3ef'
  </script>
  <style>
    html { color-scheme: only light; }
    html[data-app-theme="dark"] { color-scheme: only dark; }
    body, #root { color-scheme: inherit; }
    html[data-app-theme="light"] body { background: #f7f5f2; }
    html[data-app-theme="dark"] body { background: #000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
