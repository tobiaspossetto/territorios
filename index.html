<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#242120"/>
  <link rel="icon" type="image/png" href="./logo-furgon.png"/>
  <link rel="apple-touch-icon" href="./apple-touch-icon.png"/>
  <title>Territorios V2 · Congregación Este</title>
  <script>
    try {
      document.documentElement.dataset.appTheme = localStorage.getItem('app-v2-theme') === 'dark' ? 'dark' : 'light'
    } catch (_) {
      document.documentElement.dataset.appTheme = 'light'
    }
  </script>
  <style>
    html[data-app-theme="light"] body { background: #f7f5f2; }
    html[data-app-theme="dark"] body { background: #000; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
